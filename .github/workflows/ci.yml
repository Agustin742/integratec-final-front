name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - test
      - main
  push:
    branches:
      - develop

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion source branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF:$HEAD_REF" in
            develop:*|test:develop|main:test) ;;
            *)
              echo "Pull requests into '$BASE_REF' must come from the promotion branch (got '$HEAD_REF')." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation and CI regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/check_docs.py

      - name: Check proposed diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          else
            base="$PUSH_BEFORE"
          fi
          git diff --check "$base" HEAD --

      - name: Validate workflow with actionlint 1.7.7
        env:
          GOBIN: ${{ runner.temp }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" .github/workflows/ci.yml

      - name: Detect frontend package
        id: package
        shell: bash
        run: |
          if [[ -f package.json && ! -f pnpm-lock.yaml ]]; then
            echo "package.json exists, but pnpm-lock.yaml is missing; CI requires the pnpm lockfile." >&2
            exit 1
          fi
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.package.outputs.present == 'true'
        run: corepack enable

      - name: Set up Node.js 22
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        if: steps.package.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci/run_frontend_check.sh lint

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci/run_frontend_check.sh format:check

      - name: Check types
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ci/run_frontend_check.sh typecheck

      - name: Run tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          bash scripts/ci/run_frontend_check.sh test

      - name: Build frontend
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          VITE_APP_ENV: test
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_REALTIME_URL: wss://realtime.example.invalid
        run: bash scripts/ci/run_frontend_check.sh build

      - name: Report docs-only frontend
        if: steps.package.outputs.present == 'false'
        shell: bash
        run: |
          echo "::notice title=Tests not configured::No package.json or test script is present; no tests were run."
          {
            echo '## Tests not configured'
            echo "This frontend has no \`package.json\` or test script; no tests were run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize frontend checks
        if: always()
        env:
          LINT: ${{ steps.lint.outputs.result || 'Skipped (setup failed or no package)' }}
          FORMAT: ${{ steps.format.outputs.result || 'Skipped (setup failed or no package)' }}
          TYPECHECK: ${{ steps.typecheck.outputs.result || 'Skipped (setup failed or no package)' }}
          TEST: ${{ steps.test.outputs.result || 'Skipped (setup failed or no package)' }}
          BUILD: ${{ steps.build.outputs.result || 'Skipped (setup failed or no package)' }}
        run: |
          {
            echo '## Frontend checks'
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| lint | %s |\n' "$LINT"
            printf '| format:check | %s |\n' "$FORMAT"
            printf '| typecheck | %s |\n' "$TYPECHECK"
            printf '| test | %s |\n' "$TEST"
            printf '| build | %s |\n' "$BUILD"
          } >> "$GITHUB_STEP_SUMMARY"
